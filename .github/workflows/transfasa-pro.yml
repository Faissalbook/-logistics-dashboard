name: TransFasa Pro CI

on:
  push:
    paths: ['transfasa-pro/**', '.github/workflows/transfasa-pro.yml']
  pull_request:
    paths: ['transfasa-pro/**', '.github/workflows/transfasa-pro.yml']

defaults:
  run:
    working-directory: transfasa-pro

concurrency:
  group: transfasa-pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · typecheck · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: transfasa-pro/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Emulator tests (rules · functions · audit chain)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: transfasa-pro/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('transfasa-pro/package-lock.json') }}
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: E2E (Playwright, mobile + desktop)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: transfasa-pro/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('transfasa-pro/package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
